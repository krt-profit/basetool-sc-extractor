# JVM settings for the Gradle daemon. 2 GB is plenty for this project and keeps
# the Compose/Kotlin compiler comfortable.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compose Desktop / Kotlin work fine with configuration cache off; jpackage
# tasks in the Compose plugin are not yet fully configuration-cache safe.
org.gradle.configuration-cache=false
org.gradle.caching=true

# Never let the Compose plugin fetch its own WiX 3.11 (`downloadWix`/`unzipWix`: a zip from
# GitHub with no checksum, prepended to jpackage's PATH). The MSI is built by the SHA-512-pinned
# WiX 7 that package-msi.ps1 selects or bootstraps; build.gradle.kts hands the plugin an empty
# wixToolsetDir instead and makes packageMsi refuse to run without a WiX 4+ first on PATH.
compose.desktop.application.downloadWix=false

kotlin.code.style=official
