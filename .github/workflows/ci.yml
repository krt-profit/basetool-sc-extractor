name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # zizmor: ignore[cache-poisoning]
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run tests
        run: .\gradlew.bat --stacktrace test

      - name: Assemble app image (packaging smoke test)
        run: .\gradlew.bat --stacktrace createDistributable

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint -color

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install zizmor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/requirements/zizmor.txt
          zizmor --version

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=plain .github/workflows

  build-msi:
    name: Package MSI
    needs: [check, workflows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Validate the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Refusing to release from tag '$env:REF_NAME': expected vMAJOR.MINOR.PATCH[-suffix]."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-disabled: true

      - name: Build MSI installer
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $env:APP_VERSION = $env:REF_NAME -replace '^v', ''
          Write-Host "Releasing version $env:APP_VERSION"
          .\package-msi.ps1

      - name: Upload MSI as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: msi-installer
          path: dist/*.msi
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build-msi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: msi-installer
          path: dist

      - name: Attest build provenance for the MSI
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.msi

  publish:
    name: Publish release
    needs: [build-msi, attest]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Validate the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Refusing to release from tag '$env:REF_NAME': expected vMAJOR.MINOR.PATCH[-suffix]."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: msi-installer
          path: dist

      - name: Scan the MSI on VirusTotal
        id: virustotal
        continue-on-error: true
        timeout-minutes: 25
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          .\.github\scripts\virustotal-scan.ps1 -Path $msi.FullName

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          VIRUSTOTAL_NOTE: ${{ steps.virustotal.outputs.release_note }}
        run: |
          $msi = @(Get-ChildItem dist\*.msi)
          if ($msi.Count -ne 1) { throw "expected exactly one MSI in dist\, found $($msi.Count)" }
          $provenance = @(
            '## Build provenance',
            '',
            'This MSI ships with a signed [build provenance attestation](https://github.com/krt-profit/basetool-sc-extractor/attestations)',
            '(SLSA, Sigstore) tying it to the commit and workflow that built it. Verify the',
            'file you downloaded with the [GitHub CLI](https://cli.github.com/):',
            '',
            '```',
            'gh attestation verify <your-file>.msi --repo krt-profit/basetool-sc-extractor',
            '```'
          ) -join "`n"
          $notes = if ($env:VIRUSTOTAL_NOTE) { "$env:VIRUSTOTAL_NOTE`n`n$provenance" } else { $provenance }
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8NoBOM
          $releaseArgs = @(
            'release', 'create', $env:REF_NAME, $msi[0].FullName,
            '--verify-tag', '--title', $env:REF_NAME,
            '--notes-file', 'release-notes.md', '--generate-notes'
          )
          if ($env:REF_NAME.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
